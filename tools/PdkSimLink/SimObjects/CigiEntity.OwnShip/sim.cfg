// The container PdkSimLink creates the *view's own aircraft* from: the one entity
// the sim's camera rides when PdkSimLink.ini sets `camera=<entity id>`.  Its title
// is that file's `own_ship_title`, and it defaults to the one below.
//
// It is deliberately, permanently model-less, and that is the whole point of it
// existing separately from CigiStarter.Entity next door:
//
//   * the entity the camera rides has the eye *inside* it, so a model there is a
//     hull across the entire picture.  Measured on the bench, 2026-09-29: with
//     the AS332's body junctioned into CigiStarter.Entity (the way the other
//     entities are made visible), the parked pose showed the inside of a
//     fuselage -- "the view is inside the cabin of aircraft, not the cockpit
//     view like usual" -- and the same pose with this container showed the
//     apron, the hangars and the mountains.
//
//   * Prepar3D itself draws no aircraft for the Cigi camera: the `Cigi View`
//     definition in cameras.cfg carries HideUserAircraft, which hides the sim's
//     own aircraft.  This container is the same rule for the entity the add-on
//     created.
//
// Do NOT put a `model\` folder here.  If the own aircraft is wanted on screen --
// a chase view, or a bench comparison against the visible entities -- that is
// `own_ship_title=` emptied in PdkSimLink.ini, which creates it from `title`
// instead, model and all.
//
// The pose is unaffected either way: the own ship is still created, still moved
// to the HOST's pose every tick and still read back, so the link is proved on it
// exactly as on every other entity.
//
// The CategoryId GUID must match CigiEntity.h byte for byte -- it is the same
// physics-free object CigiStarter.Entity creates, and the two containers differ
// only in what they are allowed to draw.

[fltsim.0]
title=CigiStarter.Entity.OwnShip
model=
texture=
ui_manufacturer="CigiStarter"
ui_type="CIGI Entity (view own ship)"
ui_variation=
ui_typerole="CIGI Entity"
ui_createdby="CigiStarter"
description="The entity the sim's view rides: physics-free, never drawn."

[General]
CategoryId={7B1E4A2C-9F03-4D5B-8E6A-1C2D3E4F5A6B}
