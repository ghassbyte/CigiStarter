// The container PdkSimLink creates its entity objects from when PdkSimLink.ini
// names the title below instead of a stock one.
//
// What makes it special is one line: [General] CategoryId.  Prepar3D routes a
// container to the add-on whose RegisterSimulationCategory() registered that
// GUID, and CigiEntity.h registers the one below.  Everything else here is only
// enough to be a valid container: there is deliberately no `sim=` (no .air
// flight model) and no [contact_points] (nothing for the object to rest on), so
// the pose the HOST commands is the pose the object holds, wherever it is sent.
//
// The GUID is duplicated in CigiEntity.h -- the two must match byte for byte, or
// every CreateObject() fails and the e2e test reports create failures.
//
// No model folder ships with this container, so the object is not drawn.  Give
// it a `model\` folder (a copy of, or a junction to, the model the entities
// should appear as) to make it visible; the pose, the read-back and the
// placement proof all work without one.

[fltsim.0]
title=CigiStarter.Entity
model=
texture=
ui_manufacturer="CigiStarter"
ui_type="CIGI Entity"
ui_variation=
ui_typerole="CIGI Entity"
ui_createdby="CigiStarter"
description="A physics-free object the CIGI HOST drives through PdkSimLink."

[General]
CategoryId={7B1E4A2C-9F03-4D5B-8E6A-1C2D3E4F5A6B}
