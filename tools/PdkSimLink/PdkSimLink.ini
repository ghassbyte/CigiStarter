; PdkSimLink configuration -- read once, when Prepar3D loads the add-on.
;
; This file sits beside PdkSimLink.dll and add-on.xml.
;
; title
;   The Prepar3D container title every entity object is created from.  There is
;   no title that exists in every installation, so it has to be given here; the
;   add-on is loaded and reports itself, but creates nothing, until it is.
;
;   The name is the one in the object's sim.cfg / aircraft.cfg -- the same string
;   Prepar3D's own Vehicle Select shows (for example, an aircraft's `title=`).
;
;   Two kinds of title are meaningful, and the difference is the object's
;   behaviour, not this file:
;
;     CigiStarter.Entity
;       The physics-free object that ships with this add-on (CigiEntity.h,
;       SimObjects\CigiEntity\sim.cfg).  It has no flight model and no ground
;       contact, so the pose written is the pose that stays and a command below
;       the sim's terrain is where the object goes.  It needs the SimObjects
;       component of add-on.xml to be present, and it is not drawn unless a
;       `model\` folder is put in its container (the README says how).
;
;     any stock title (e.g. an aircraft's)
;       The sim's own object, with its own simulation between the writes.  Useful
;       for a like-for-like bench comparison -- it is the object that used to be
;       clamped to the terrain -- but a real installation wants the one above.
;
;   Put a simple, low-poly object here while bringing the link up, and change it
;   once the entities move acceptably.
[simlink]
title=
