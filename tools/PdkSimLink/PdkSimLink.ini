; PdkSimLink configuration -- read once, when Prepar3D loads the add-on.
;
; This file sits beside PdkSimLink.dll and add-on.xml.
;
; title
;   The Prepar3D container title every entity object is created from.  There is
;   no title that exists in every installation, so it has to be given here; the
;   add-on is loaded and reports itself, but creates nothing, until it is.
;
;   The name is the one in the object's sim.cfg / aircraft.cfg -- the same string
;   Prepar3D's own Vehicle Select shows (for example, an aircraft's `title=`).
;
;   Two kinds of title are meaningful, and the difference is the object's
;   behaviour, not this file:
;
;     CigiStarter.Entity
;       The physics-free object that ships with this add-on (CigiEntity.h,
;       SimObjects\CigiEntity\sim.cfg).  It has no flight model and no ground
;       contact, so the pose written is the pose that stays and a command below
;       the sim's terrain is where the object goes.  It needs the SimObjects
;       component of add-on.xml to be present, and it is not drawn unless a
;       `model\` folder is put in its container (the README says how).
;
;     any stock title (e.g. an aircraft's)
;       The sim's own object, with its own simulation between the writes.  Useful
;       for a like-for-like bench comparison -- it is the object that used to be
;       clamped to the terrain -- but a real installation wants the one above.
;
;   Put a simple, low-poly object here while bringing the link up, and change it
;   once the entities move acceptably.
;
; own_ship_title
;   The container the *view's own aircraft* is created from: the one entity the
;   sim's camera rides when `camera` below is set.  The eye is inside that entity,
;   so it must not be drawn -- a model there is a hull across the whole picture.
;   The default is the model-less container that ships for this and nothing else
;   (SimObjects\CigiEntity.OwnShip\sim.cfg), so entity 0 still arrives, is still
;   moved to the HOST's pose and is still read back; only the drawing is gone.
;   Think of it as this add-on's equivalent of the HideUserAircraft that
;   Prepar3D's own `Cigi View` definition applies to the sim's own aircraft.
;
;   Leave it out to keep the default.  Set it *empty* to draw the own ship too,
;   from `title` -- only wanted where the camera is not riding the picture that
;   matters (a chase view, or a bench comparison against the visible entities).
;   It only means anything while `camera` is set: with no camera there is no own
;   ship, and every entity is created from `title`.
;
;     own_ship_title=CigiStarter.Entity.OwnShip
;
; camera
;   Fly the simulator's own view from a HOST entity.
;
;   Prepar3D's view is a per-window camera, and a ViewGroup renders its channels
;   from that window's *active* camera (the per-channel angles are frustum
;   offsets on top of it), so the picture moves iff the camera does.  The entity
;   objects this add-on creates are separate, non-user objects: they move without
;   moving the view.  `camera` is what makes the picture follow one of them.
;
;   The value is the CIGI entity id the camera should ride -- normally 0, the
;   HOST's own aircraft.  The pose is applied every frame, so the attitude
;   (roll/pitch/yaw) flies with it.  Leave it absent (or blank) and the sim's
;   view is left completely alone, which is the default.
;
;   The eye is the HOST's, not the entity's reference point.  The HOST says
;   where its own viewpoint is in a CIGI View Control, CigiStarter carries that
;   across with the poses, and the camera is placed there -- 2.8 m forward of
;   entity 0's reference point, half a metre up and 5 cm right in every capture:
;   the pilot's seat.  With no View Control, or one attached to another entity,
;   the camera sits on the entity's reference point as before.  Because the eye
;   is then *inside* the aircraft, the entity it rides should not be drawn (see
;   own_ship_title above).
;
;   This needs a camera definition whose Origin is Fixed: only a Fixed-origin
;   camera can be positioned from outside.  Prepar3D ships one for exactly this
;   job -- `Cigi View`, its own CIGI out-the-window camera -- so nothing has to
;   be added.  `camera_view` below points at a different one if wanted.
;
;     camera=0
;
; camera_view
;   The name of the camera definition every 3D view is put onto before it is
;   driven.  It has to be a Fixed-origin definition (in Cameras.cfg or an
;   aircraft.cfg).  The default is Prepar3D's own `Cigi View`.
;
;     camera_view=Cigi View
;
; camera_log
;   Write PdkSimLink.camera.log beside the DLL: about one line a second per
;   driven view, each saying what the camera was told (the entity's pose and the
;   eye the view puts it at) and what it then reports back (GetLLA/GetPBH).  Off
;   by default.
;
;   It exists because the camera is the one part of this add-on with no status
;   word of its own -- the shared region says the entities moved, and says
;   nothing about the sim's view -- and because a camera that has quietly
;   refused SetLLA looks exactly like one that has moved.  Turn it on when the
;   picture is not doing what the entity rows say it should.
;
;     camera_log=1
[simlink]
title=
own_ship_title=CigiStarter.Entity.OwnShip
camera=
camera_view=Cigi View
camera_log=0
